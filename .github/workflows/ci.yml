# Runs on every pull request and on pushes to main.
# The job is named `ci` so branch protection on main can require it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vite build does not type-check, so run tsc as its own step.
      - run: npm run typecheck

      - run: npm run lint:sim

      - run: npm test

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          CI: true
